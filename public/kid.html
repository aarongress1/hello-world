<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#6d4bff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Curio" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="icon" href="/icon.svg" />
  <title>Curio</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body { background: linear-gradient(160deg, #efeaff 0%, #fff6ee 100%); min-height: 100vh; }
    .kid-wrap { max-width: 780px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; }
    .kid-top { display:flex; align-items:center; justify-content:space-between; padding: 8px 4px 16px; }
    .kid-top .who { display:flex; align-items:center; gap:.6rem; font-weight:900; font-size:1.2rem; }
    .kid-top .owl { font-size:2rem; }
    .quests { display:flex; gap:.5rem; overflow-x:auto; padding-bottom:.6rem; }
    .qchip { flex:0 0 auto; background:#fff; border:2px solid var(--line); border-radius:999px; padding:.4rem .9rem; font-weight:800; cursor:pointer; font-size:.9rem; }
    .qchip.active { border-color:var(--brand); background:var(--brand-soft); color:var(--brand-deep); }
    .qchip.pending { border-color:var(--warn); color:var(--warn); }
    .qchip.add { background:var(--brand); color:#fff; border-color:var(--brand); }
    .chat { flex:1; overflow-y:auto; padding: 12px 4px; display:flex; flex-direction:column; gap:.6rem; }
    .msg { padding:.75rem 1rem; border-radius:20px; max-width:82%; font-size:1.08rem; line-height:1.5; white-space:pre-wrap; }
    .msg.kid { background:var(--brand); color:#fff; align-self:flex-end; border-bottom-right-radius:6px; }
    .msg.guide { background:#fff; align-self:flex-start; border-bottom-left-radius:6px; box-shadow:var(--shadow-sm); }
    .msg.guide.flag { border:2px solid var(--warn); }
    .typing { align-self:flex-start; color:var(--ink-soft); font-weight:800; padding:.5rem 1rem; }
    .composer { display:flex; gap:.5rem; padding: 10px 0 6px; position:sticky; bottom:0; }
    .composer input { flex:1; border-radius:999px; border:2px solid var(--brand-soft); font-size:1.1rem; padding:.85rem 1.2rem; }
    .composer button { border-radius:999px; }
    .welcome { text-align:center; color:var(--ink-soft); padding: 2rem 1rem; }
    .welcome .big { font-size:3rem; }
    .starter { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; max-width:460px; margin:1rem auto 0; }
    .starter button { background:#fff; border:2px solid var(--line); border-radius:16px; padding:1rem; font-family:inherit; font-weight:800; cursor:pointer; font-size:1rem; }
    .starter button:hover { border-color:var(--brand); }
    .exit { font-size:.85rem; color:var(--ink-soft); font-weight:800; background:transparent; border:0; cursor:pointer; }
    /* Focus header — calm, not gamified. No points, no flashing. */
    .focus { background:#fff; border:1px solid var(--line); border-radius:16px; padding:.7rem 1rem; margin-bottom:.6rem; display:none; }
    .focus.on { display:block; }
    .focus .top { display:flex; justify-content:space-between; align-items:center; gap:.5rem; font-weight:800; }
    .focus .goal { color:var(--ink); }
    .focus .time { color:var(--ink-soft); font-size:.85rem; font-weight:700; }
    .focus .bar { height:5px; background:var(--brand-soft); border-radius:999px; margin-top:.5rem; overflow:hidden; }
    .focus .bar span { display:block; height:100%; background:var(--mint); width:0; transition:width .6s ease; }
    /* Start screen */
    .start { text-align:center; padding:1.5rem 1rem; }
    .start .card { text-align:left; max-width:460px; margin:1rem auto; }
    .start h2 { font-size:1.6rem; }
    .start .obj { background:var(--brand-soft); border-radius:14px; padding:1rem; font-weight:800; margin:1rem 0; }
    .mins { display:flex; gap:.4rem; justify-content:center; flex-wrap:wrap; margin:.6rem 0; }
    .mins button { border:2px solid var(--line); background:#fff; border-radius:999px; padding:.4rem .9rem; font-family:inherit; font-weight:800; cursor:pointer; }
    .mins button.sel { border-color:var(--brand); background:var(--brand-soft); color:var(--brand-deep); }
    .winddown { background:#f1fbf7; border:2px solid var(--mint); border-radius:16px; padding:1rem 1.2rem; margin:.6rem 0; align-self:stretch; }
    .winddown h3 { margin:0 0 .3rem; }
  </style>
</head>
<body>
  <div class="kid-wrap">
    <div class="kid-top">
      <div class="who"><span class="owl">🦉</span> <span id="hello">Curio</span></div>
      <button class="exit" onclick="exitKid()">🔒 Parent area</button>
    </div>
    <div class="focus" id="focus">
      <div class="top"><span class="goal" id="focusGoal">Today's focus</span><span class="time" id="focusTime"></span></div>
      <div class="bar"><span id="focusFill"></span></div>
    </div>
    <div class="quests" id="quests"></div>
    <div class="chat" id="chat"></div>
    <form class="composer" id="composer" onsubmit="return send(event)">
      <input id="input" placeholder="Type to Curio…" autocomplete="off" autofocus />
      <button class="btn" type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/kid.js"></script>
</body>
</html>
