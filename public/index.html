<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#6d4bff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Curio" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="icon" href="/icon.svg" />
  <title>Curio — Sign in</title>
  <meta name="description" content="Sign in to Curio — a K–8 learning companion with safety rails you control." />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body { min-height: 100vh; background: linear-gradient(165deg, #efeaff 0%, #fff6ee 100%); }
    .auth-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px; }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand .owl { font-size: 3rem; display: block; }
    .brand .name { font-weight: 900; font-size: 1.8rem; letter-spacing: -0.01em; }
    .brand .name .tag { color: var(--brand-deep); }
    .brand .tagline { color: var(--ink-soft); font-weight: 700; margin-top: .2rem; }
    .auth-card { background: #fff; border-radius: 24px; box-shadow: var(--shadow); width: 100%; max-width: 420px; padding: 26px 24px; }
    .tabs { display: flex; background: var(--brand-soft); border-radius: 999px; padding: 4px; margin-bottom: 18px; }
    .tabs button { flex: 1; border: 0; background: transparent; font-family: inherit; font-weight: 800; color: var(--ink-soft); padding: .6rem; border-radius: 999px; cursor: pointer; font-size: .98rem; }
    .tabs button.active { background: #fff; color: var(--brand-deep); box-shadow: var(--shadow-sm); }
    .auth-card label { display: block; font-weight: 800; font-size: .9rem; margin: .7rem 0 .25rem; }
    .auth-card input { width: 100%; border: 2px solid var(--brand-soft); border-radius: 14px; font-size: 1.05rem; padding: .8rem 1rem; font-family: inherit; }
    .auth-card input:focus { outline: none; border-color: var(--brand); }
    .auth-card .btn { width: 100%; margin-top: 1rem; padding: .9rem; font-size: 1.05rem; }
    .foot { text-align: center; margin-top: 18px; color: var(--ink-soft); font-size: .88rem; }
    .foot a { color: var(--brand-deep); font-weight: 800; text-decoration: none; }
    .form-msg { min-height: 1.1rem; margin-top: .5rem; font-weight: 700; font-size: .9rem; }
    .form-msg.error { color: var(--danger); }
    .trust { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:14px; color:var(--ink-soft); font-size:.82rem; font-weight:700; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="brand">
      <span class="owl">🦉</span>
      <div class="name">Curio<span class="tag">Kids</span></div>
      <div class="tagline">Where curiosity becomes mastery</div>
    </div>

    <div class="auth-card">
      <div class="tabs">
        <button id="tabLogin" class="active" onclick="switchTab('login')">Sign in</button>
        <button id="tabSignup" onclick="switchTab('signup')">Create account</button>
      </div>
      <h2 id="authTitle" style="text-align:center;margin:.1rem 0 .6rem;font-size:1.3rem;">Welcome back</h2>
      <form id="authForm" onsubmit="return submitAuth(event)">
        <div id="nameRow" style="display:none;">
          <label for="name">Your name</label>
          <input id="name" type="text" autocomplete="name" placeholder="Parent / guardian name" />
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="At least 8 characters" />
        <div class="form-msg" id="authMsg"></div>
        <button class="btn" type="submit" id="authSubmit">Sign in</button>
      </form>
      <div class="trust"><span>🔒 Encrypted</span><span>🛡️ Parent-controlled</span><span>👨‍👩‍👧 K–8</span></div>
    </div>

    <p class="foot">New to Curio? <a href="/welcome">See how it works →</a></p>
  </div>

  <script src="/js/common.js"></script>
  <script>
    let mode = 'login';
    function switchTab(m) {
      mode = m;
      el('tabLogin').classList.toggle('active', m === 'login');
      el('tabSignup').classList.toggle('active', m === 'signup');
      el('nameRow').style.display = m === 'signup' ? 'block' : 'none';
      el('authTitle').textContent = m === 'signup' ? 'Create your parent account' : 'Welcome back';
      el('authSubmit').textContent = m === 'signup' ? 'Create account' : 'Sign in';
      el('password').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
      el('authMsg').textContent = '';
    }
    async function submitAuth(e) {
      e.preventDefault();
      const msg = el('authMsg'); msg.className = 'form-msg'; msg.textContent = 'Working…';
      try {
        const body = { email: el('email').value, password: el('password').value };
        if (mode === 'signup') body.name = el('name').value;
        await api(mode === 'signup' ? '/api/signup' : '/api/login', { method: 'POST', body });
        window.location.href = '/parent.html';
      } catch (err) {
        msg.className = 'form-msg error'; msg.textContent = err.message;
      }
      return false;
    }
    // Already signed in? Go straight to the dashboard (the app opens here).
    api('/api/me').then((d) => { if (d.parent) window.location.replace('/parent.html'); }).catch(() => {});
    // Deep-link: /?mode=signup opens the create-account tab.
    if (/[?&]mode=signup/.test(location.search)) switchTab('signup');
  </script>
</body>
</html>
